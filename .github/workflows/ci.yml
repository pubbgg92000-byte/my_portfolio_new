name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          # Lets the GitHub activity section fetch with a higher rate limit on shared runners.
          GITHUB_TOKEN: ${{ github.token }}

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Smoke tests
        run: npm test

      - name: Start server for Lighthouse
        run: |
          npx next start -p 3999 &
          for i in $(seq 1 30); do curl -sf http://localhost:3999/ >/dev/null && break; sleep 1; done

      - name: Lighthouse budget
        run: npm run lighthouse

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
